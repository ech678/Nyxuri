# ==============================================================================
# Mango WM 显示器配置文件 (monitors.conf)
# ==============================================================================
# 说明：此文件受 Manifest preserve 保护，由 Noctalia 显示设置插件动态生成与管理。
# 默认无需手动指定，Mango WM 与 Noctalia 会自动识别并以推荐设置驱动所有连接的物理显示器。
# 若需针对特定屏幕进行个性化调整，可参考以下示例取消注释：
#
# 示例 1: 笔记本内置屏幕 (标准 1080p@60Hz)
# monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
#
# 示例 2: 外接高刷主显示器 (2K 165Hz)
# monitor_rule=name:^DP-1$,width:2560,height:1440,refresh:165,x:1920,y:0,scale:1
# ==============================================================================
