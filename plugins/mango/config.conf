# ==============================================================================
# Mango Wayland Compositor 主配置文件 (config.conf)
# Adapted for MangoWM 0.18.0 & Nyxuri Desktop Environment
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 视觉效果与窗口装饰 (Appearance & Window Decorations)
# ------------------------------------------------------------------------------
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ff

border_radius=12
no_radius_when_single=0
border_px=0
no_border_when_single=0

focused_opacity=0.9
unfocused_opacity=0.85

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# 动画系统 (Animations: slide / zoom / fade / none)
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=300
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,0.99
animation_curve_move=0.46,1.0,0.29,0.99
animation_curve_tag=0.46,1.0,0.29,0.99
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,0.99
animation_curve_opacity_fade_in=0.46,1.0,0.29,0.99
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5

# ------------------------------------------------------------------------------
# 2. 布局与滚动条配置 (Layouts & Scroller Configuration)
# ------------------------------------------------------------------------------
# Scroller 布局 (优先级: scroller_prefer_overspread > scroller_focus_center > scroller_prefer_center)
scroller_structs=20
scroller_default_proportion=0.9
scroller_prefer_overspread=0
scroller_focus_center=1
edge_scroller_pointer_focus=0
edge_scroller_focus_allow_speed=0.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=0.9
scroller_proportion_preset=0.667,0.8,1.0

# Master-Stack 与多布局循环
new_is_master=1
default_master_factor=0.55
default_master_count=1
center_master_overspread=0
center_when_single_stack=1
tag_num=9
tag_gather=0
smart_gaps=0
circle_layout=scroller,tile,monocle,grid,deck,dwindle

# Dwindle 动态二叉树分割布局 (0.18.0)
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0
dwindle_smart_resize=0

# Monocle 与 Deck 自动标签栏模式 (0.18.0 Auto Tab Bar)
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0
deck_tab_mode=1

# 概览与跳转模式 (Overview & Jump Mode)
enable_hotarea=0
hotarea_size=10
hotarea_corner=2
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# 边距间隙 (Gaps)
gap_inner_horizontal=12
gap_inner_vertical=12
gap_outer_horizontal=12
gap_outer_vertical=12

# 便签与特殊工作区间隙 (Scratchpad & Special Tag 0)
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
single_scratchpad=1
scratchpad_cross_monitor=0
special_gap_inner_horizontal=12
special_gap_inner_vertical=12
special_gap_outer_horizontal=12
special_gap_outer_vertical=12
special_dim=0.5

# ------------------------------------------------------------------------------
# 3. 系统、焦点与输入设备行为 (System, Focus & Input Devices)
# ------------------------------------------------------------------------------
# 0.18.0 系统特性：配置文件及 source 子文件热监听重载、XWayland 常驻、SyncObj 防卡顿
auto_reload_config=1
xwayland_persistence=1
sync_obj_enable=1
allow_shortcuts_inhibit=1
allow_lock_transparent=0

# 焦点与窗口拖拽/边缘缩放 (0.18.0 无边框边缘拖拽缩放)
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
exchange_cross_monitor=0
focus_cross_tag=0
view_current_to_back=1
enable_floating_snap=1
snap_distance=30
float_full_to_top=0
drag_tile_to_tile=1
drag_tile_small=1
drag_corner=3
drag_warp_cursor=1
enable_border_resize=1
border_resize_size=10
axis_bind_apply_timeout=100

# 键盘与光标
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us
cursor_theme=Colloid-dark-cursors
cursor_size=24
cursor_hide_on_keypress=1
cursor_hide_timeout=0

# 界面与装饰字体 (对齐系统 Noto Sans CJK SC 字体规范)
jump_label_decorate_font_desc=Noto Sans CJK SC Bold 14
group_bar_decorate_font_desc=Noto Sans CJK SC Bold 12
tab_bar_decorate_font_desc=Noto Sans CJK SC Bold 12

# 鼠标与触控板 (含 0.18.0 实时跟手手势预览 gesture_live)
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_accel_speed=-0.72
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
gesture_live=1
gesture_swipe_distance=300
gesture_swipe_cancel_ratio=0.5
gesture_swipe_min_speed_to_force=10

# ------------------------------------------------------------------------------
# 4. 显示器与工作区配置 (Monitors & Workspaces)
# ------------------------------------------------------------------------------
# 优先加载由 Noctalia Display 插件生成的显示器配置 (跨部署保留)
source_optional=~/.config/mango/monitors.conf

# 显示器规则（默认无需配置，Mango WM 将自动以显示器原生最佳分辨率与刷新率驱动）
# monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1

# 0.18.0 通配符标签规则：统一设置所有工作区默认采用 Scroller 布局并常驻显示
tag_rule=id:*,no_hide:1,layout_name:scroller

# ------------------------------------------------------------------------------
# 5. 快捷键绑定 (Keybindings)
# ------------------------------------------------------------------------------
# 系统与窗口管理
bind=SUPER,Tab,toggleoverview
bind=SUPER+SHIFT,Tab,togglejump
bind=SUPER,Grave,focuslast
bind=SUPER,Q,killclient
bind=SUPER,Return,spawn,kitty
bind=SUPER,E,spawn,nautilus

# 外壳网关与桌面操作 (适配 Nyxuri 统一 shell-action 网关)
bind=SUPER,R,spawn,/home/user/.config/mango/scripts/shell-action.sh launcher
bind=SUPER,X,spawn,/home/user/.config/mango/scripts/shell-action.sh session
bind=SUPER,I,spawn,/home/user/.config/mango/scripts/shell-action.sh settings
bind=SUPER,V,spawn,/home/user/.config/mango/scripts/shell-action.sh clipboard
bind=SUPER,W,spawn,/home/user/.config/mango/scripts/shell-action.sh wallpaper-picker
bind=SUPER+CTRL,W,spawn,/home/user/.config/mango/scripts/shell-action.sh wallpaper-random
bind=SUPER+SHIFT,W,spawn,noctalia msg panel-toggle noctalia/mpvpaper:picker
bind=SUPER,N,spawn,noctalia msg nightlight-toggle
bindl=SUPER,L,spawn,/home/user/.config/mango/scripts/shell-action.sh lock
bind=SUPER+CTRL,A,spawn,/home/user/.config/mango/scripts/shell-action.sh radial-launcher
bind=ALT,E,spawn,/home/user/.config/mango/scripts/shell-action.sh translate
bind=SUPER,slash,spawn,/home/user/.config/mango/scripts/hotkey-helper.py
bind=SUPER+SHIFT,question,spawn,/home/user/.config/mango/scripts/hotkey-helper.py

# 方向与焦点导航
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# 客户端交换与移动
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Right,exchange_client,right

bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right

# Scroller 堆栈合并/分离与比例预设
bind=SUPER,Comma,scroller_stack,left
bind=SUPER,Period,scroller_stack,right
bind=SUPER,M,switch_proportion_preset

# 布局切换与窗口状态
bind=SUPER,T,togglefloating
bind=SUPER,F,togglefullscreen
bind=SUPER,A,togglemaximizescreen
bind=SUPER,Space,switch_layout
bind=SUPER,P,togglefakefullscreen
bind=SUPER,C,centerwin
bind=SUPER,Y,zoom
bind=SUPER,O,toggleoverlay
bind=SUPER+SHIFT,F,toggle_all_floating

# 0.18.0 窗口分组管理 (Window Group Bar)
bind=SUPER,B,togglegroupbar
bind=SUPER+SHIFT,B,groupleave
bind=SUPER,BracketLeft,groupfocus,prev
bind=SUPER,BracketRight,groupfocus,next
bind=SUPER+ALT,H,groupjoin,left
bind=SUPER+ALT,J,groupjoin,down
bind=SUPER+ALT,K,groupjoin,up
bind=SUPER+ALT,L,groupjoin,right

# 便签与最小化 (Scratchpad & Minimize)
bind=SUPER,Z,toggle_scratchpad
bind=SUPER+SHIFT,Z,minimized
bind=SUPER+ALT,Z,restore_minimized

# 特殊工作区 (Special Tag 0)
bind=SUPER,G,toggle_special_tag
bind=SUPER+SHIFT,G,tag_special_tag
bind=SUPER+CTRL,G,tag_special_silent

# 窗口切换器
bind=ALT,Tab,switcher,next
bind=ALT+SHIFT,Tab,switcher,prev

# 鼠标移动与缩放
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# 触控板手势 (Touchpad Gestures: 配合 gesture_live=1 支持 4 指实时跟手预览)
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# 工作区切换 (Super + 1-9)、多选并集查看 (Super+Ctrl + 1-9) 与窗口迁移 (Alt / Super+Shift + 1-9)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

bind=ALT,1,tag,1,0
bind=ALT,2,tag,2,0
bind=ALT,3,tag,3,0
bind=ALT,4,tag,4,0
bind=ALT,5,tag,5,0
bind=ALT,6,tag,6,0
bind=ALT,7,tag,7,0
bind=ALT,8,tag,8,0
bind=ALT,9,tag,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# 截图热键 (Screenshots)
bind=SUPER+SHIFT,S,spawn_shell,grim -g "$(slurp)" - | wl-copy

key_mode=common
bind=SUPER+SHIFT,E,quit
bind=SUPER+SHIFT,R,reload_config

# 多媒体按键 (WirePlumber / Noctalia IPC，支持锁屏状态触发 bindl)
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86AudioPlay,spawn,noctalia msg media play-pause
bindl=NONE,XF86AudioNext,spawn,noctalia msg media next
bindl=NONE,XF86AudioPrev,spawn,noctalia msg media previous

# 屏幕亮度 (走统一 mango-brightness 脚本，兼顾内屏背光与外接屏 DDC/CI，支持锁屏触发 bindl)
bindl=NONE,XF86MonBrightnessUp,spawn,/home/user/.config/mango/scripts/mango-brightness.sh up
bindl=NONE,XF86MonBrightnessDown,spawn,/home/user/.config/mango/scripts/mango-brightness.sh down

# 截屏按键
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=CTRL,Print,spawn_shell,grim -o "$(mmsg get cursorpos | jq -r '.monitor')" - | wl-copy
bind=ALT,Print,spawn_shell,grim -g "$(mmsg get focusing-client | jq -r '"\(.x),\(.y) \(.width)x\(.height)"')" - | wl-copy
key_mode=default

# 多显示器焦点与分配
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=ALT+SHIFT,Down,focusmon,down
bind=ALT+SHIFT,Up,focusmon,up

bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right
bind=SUPER+ALT,Down,tagmon,down
bind=SUPER+ALT,Up,tagmon,up

# 滚轮切换工作区
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ------------------------------------------------------------------------------
# 6. 窗口与图层规则 (Window & Layer Rules)
# ------------------------------------------------------------------------------
window_rule=is_floating:1,width:0.65,height:0.75,app_id:^dev\.noctalia\.Noctalia$
window_rule=is_floating:1,app_id:^org\.quickshell$
window_rule=is_floating:0,app_id:^(gnome-control-center|org\.gnome\.Settings)$
window_rule=is_floating:0,app_id:^(pavucontrol|org\.pulseaudio\.pavucontrol)$
window_rule=is_floating:0,app_id:^nm-connection-editor$
window_rule=is_floating:1,app_id:^(org\.gnome\.Calculator|gnome-calculator|galculator)$
window_rule=is_floating:1,app_id:^blueman-manager$
window_rule=is_floating:1,app_id:^org\.gnome\.Nautilus$
window_rule=is_floating:1,app_id:^xdg-desktop-portal
window_rule=is_floating:1,is_global:1,focused_opacity:1.0,unfocused_opacity:1.0,title:(Picture-in-Picture|画中画)
window_rule=is_floating:1,app_id:^zoom$
window_rule=is_floating:1,width:532,height:925,app_id:^io\.ente\.auth$
window_rule=is_floating:1,width:0.65,height:0.70,app_id:^io\.missioncenter\.MissionCenter$
window_rule=is_floating:1,app_id:wpsoffice,title:字体
window_rule=is_open_silent:1,app_id:^QQ$,title:^(资料卡|天气)$
window_rule=is_floating:1,app_id:^QQ$,title:^群聊的聊天记录$

layer_rule=no_blur:1,no_shadow:1,layer_name:^noctalia-bar-bar
layer_rule=no_animation:1,no_blur:1,layer_name:^selection$

# ------------------------------------------------------------------------------
# 7. 环境变量 (Environment Variables)
# ------------------------------------------------------------------------------
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=QT_IM_MODULES,wayland;fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=MOZ_ENABLE_WAYLAND,1
env=XCURSOR_THEME,Colloid-dark-cursors
env=XCURSOR_SIZE,24

# ------------------------------------------------------------------------------
# 8. 自启动与桌面外壳 (Startup & Desktop Shell)
# ------------------------------------------------------------------------------
exec_once=dex -a
exec_once=fcitx5
exec_once=wl-clip-persist --clipboard regular --reconnect-tries 0
exec_once=wl-paste --type text --watch cliphist store
exec_once=/home/user/.config/mango/scripts/session-shell.sh

# ------------------------------------------------------------------------------
# 9. 动态主题与组件挂载 (Dynamic Theme & Custom Extensibility)
# ------------------------------------------------------------------------------
# 加载 Noctalia 动态渲染的主题配色 (受 Manifest preserve 保护)
source_optional=~/.config/mango/noctalia.conf

# 加载用户自定义配置 (受 Nyxuri Dunder __custom__ 协议保护，更新自动继承)
source_optional=~/.config/mango/__custom__.conf

# ------------------------------------------------------------------------------
# 10. 交互模式与调整模式 (Keymodes & Resize)
# ------------------------------------------------------------------------------
key_mode=default
bind=SUPER+CTRL,R,setkeymode,resize

key_mode=resize
bind=NONE,Left,resizewin,-40,0
bind=NONE,Right,resizewin,+40,0
bind=NONE,Up,resizewin,0,-40
bind=NONE,Down,resizewin,0,+40
bind=NONE,H,smartresizewin,left
bind=NONE,J,smartresizewin,down
bind=NONE,K,smartresizewin,up
bind=NONE,L,smartresizewin,right
bind=NONE,M,setmfact,+0.05
bind=SHIFT,M,setmfact,-0.05
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default

key_mode=default
