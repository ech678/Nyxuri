# Nyxuri Shell builtin template registry.
#
# Rendered by services TemplateService through commons TemplateExpr.js
# (Noctalia-compatible expression subset). matugen takes no part in template
# rendering: it only extracts the palettes (P4 contract).
#
# input_path resolves like the registry parser always did: relative to this
# directory, or absolute, or ~/$HOME-prefixed. $TEMPLATE_DIR inside hooks
# expands to the rendered template's directory at runtime.
#
# The gtk/niri/palette entries consume the shared template pool deployed to
# ~/.config/nyxuri/templates/ by the `theme` unit (KM4/P5 neutral pool —
# namespace-free, survives without the noctalia unit); on a checkout without
# that pool these entries surface as invalid instead of silently vanishing.

[config]
version_check = false

[templates.kitty]
input_path = "kitty/kitty.conf"
output_path = "~/.config/kitty/themes/nyxuri.conf"
post_hook = "bash \"$TEMPLATE_DIR/kitty-apply.sh\""

[templates.btop]
input_path = "btop/btop.theme"
output_path = "~/.config/btop/themes/nyxuri.theme"
post_hook = "bash \"$TEMPLATE_DIR/btop-apply.sh\""

[templates.starship]
input_path = "starship/starship.toml"
output_path = "~/.cache/nyxuri/starship-palette.toml"
post_hook = "bash \"$TEMPLATE_DIR/starship-apply.sh\""

# Shared template pool (rendered for whichever shell is active).
[templates.gtk3]
input_path = "~/.config/nyxuri/templates/gtk-3.0.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/nyxuri/templates/gtk-4.0.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.niri_glow]
input_path = "~/.config/nyxuri/templates/niri-glow-material-you.kdl"
output_path = "~/.config/niri/colors.kdl"

[templates.palette_toml]
input_path = "~/.config/nyxuri/templates/palette.toml"
output_path = "~/.cache/nyxuri/palette.toml"

# Fcitx5 NyxMellow 动态皮肤（mellow 形状 + Material You 自动取色）
[templates.fcitx5_theme]
input_path = "~/.local/share/fcitx5/themes/nyxmellow/templates/theme.conf"
output_path = "~/.local/share/fcitx5/themes/nyxmellow/theme.conf"

[templates.fcitx5_panel]
input_path = "~/.local/share/fcitx5/themes/nyxmellow/templates/panel.svg"
output_path = "~/.local/share/fcitx5/themes/nyxmellow/panel.svg"

[templates.fcitx5_highlight]
input_path = "~/.local/share/fcitx5/themes/nyxmellow/templates/highlight.svg"
output_path = "~/.local/share/fcitx5/themes/nyxmellow/highlight.svg"
post_hook = "busctl --user --auto-start=no call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 ReloadAddonConfig s classicui >/dev/null 2>&1 || true"

