# Shell ui plugin (plugin-model.md §6): runtime-only — the switch lives
# in the ledger and the running shell projects it; no files ship from here.
schemaVersion = 1
id = "shell.keystone"
kinds = ["island"]
label = "Keystone Island"
order = 50

[entryPoints]
island = "Keystone.qml"

# Settings schema (manifest-schema.md): navigation routes and search
# anchors live here — the runtime registry (PluginRegistry) is the only
# consumer; group keys drive the nav pane's geometric clustering only.

[[settings]]
id = "keystone"
source = "KeystonePage.qml"
title = "Keystone"
description = "Style, clock, and media controls"
context = "ControlCenterWindow"
icon = "toggle_off"
group = "surfaces"
order = 70

[[settings]]
id = "keystone.horizontal-clock"
source = "HorizontalClockPage.qml"
title = "Horizontal clock style"
description = "Horizontal clock appearance"
context = "KeystonePage"
icon = "schedule"
group = "surfaces"
order = 71

[[settings]]
id = "keystone.section.horizontal-clock"
route = "keystone"
title = "Horizontal clock"
context = "KeystonePage"
icon = "toggle_off"

[[settings]]
id = "keystone.section.keyboard-indicators"
route = "keystone"
title = "Keyboard indicators"
context = "KeystonePage"
icon = "settings"

[[settings]]
id = "keystone.section.keyhole"
route = "keystone"
title = "Keyhole"
context = "KeystonePage"
icon = "settings"

[[settings]]
id = "keystone.section.keystone-style"
route = "keystone"
title = "Keystone style"
context = "KeystonePage"
icon = "toggle_off"

[[settings]]
id = "keystone.section.media-controls"
route = "keystone"
title = "Media controls"
context = "KeystonePage"
icon = "music_note"

[[settings]]
id = "keystone.section.mouse-actions"
route = "keystone"
title = "Mouse actions"
context = "KeystonePage"
icon = "toggle_off"

[[settings]]
id = "keystone.section.recording"
route = "keystone"
title = "Recording"
context = "KeystonePage"
icon = "toggle_off"

[[settings]]
id = "keystone.horizontal-clock.section.horizontal-clock-style"
route = "keystone.horizontal-clock"
title = "Horizontal clock style"
context = "HorizontalClockPage"
icon = "schedule"

# Searchable fixed actions (manifest-schema.md): the search index's
# include set for this plugin's IPC face.

[[actions]]
id = "nyxuri:keystone:closeAllOthers"
target = "keystone"
method = "closeAllOthers"
availability = "keystone"

[actions.search]
title = "Close Keystone panels"
description = "Dismiss open Keystone panels"
context = "SpotlightActions"
icon = "close"
aliases = ["island"]

[[actions]]
id = "nyxuri:keystone:dashboard"
target = "keystone"
method = "dashboard"
availability = "keystone"

[actions.search]
title = "Keystone dashboard"
description = "Toggle the Keystone dashboard"
context = "SpotlightActions"
icon = "dashboard"
aliases = ["island"]

[[actions]]
id = "nyxuri:keystone:hub"
target = "keystone"
method = "hub"
availability = "keystone"

[actions.search]
title = "Keystone hub"
description = "Toggle the Keystone hub"
context = "SpotlightActions"
icon = "hub"
aliases = ["island"]

[[actions]]
id = "nyxuri:keystone:lyrics"
target = "keystone"
method = "lyrics"
availability = "keystone"

[actions.search]
title = "Lyrics"
description = "Toggle Keystone lyrics"
context = "SpotlightActions"
icon = "lyrics"
aliases = ["music"]

[[actions]]
id = "nyxuri:keystone:tools"
target = "keystone"
method = "tools"
availability = "keystone"

[actions.search]
title = "Keystone tools"
description = "Toggle the Keystone tools panel"
context = "SpotlightActions"
icon = "handyman"
aliases = ["record", "timer"]
