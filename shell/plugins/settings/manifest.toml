# Shell ui plugin (plugin-model.md §6): runtime-only — the switch lives
# in the ledger and the running shell projects it; no files ship from here.
# Settings aggregator (S0-3a): domain pages are owned by their plugins'
# manifests; this plugin keeps the host-level pages with no owning domain
# (account / theme / connectivity / language / shortcuts / shell / about)
# plus the window shells themselves.
schemaVersion = 1
id = "shell.settings"
kinds = ["overlay"]
label = "Settings"
order = 110

[entryPoints]
overlay = "SettingsHost.qml"

# Settings schema (manifest-schema.md): navigation routes and search
# anchors live here — the runtime registry (PluginRegistry) is the only
# consumer; group keys drive the nav pane's geometric clustering only.

[[settings]]
id = "account"
source = "AccountPage.qml"
title = "Account"
description = "Profile name, avatar, and banner"
context = "ControlCenterWindow"
icon = "account_circle"
group = "personalization"
order = 10

[[settings]]
id = "theme"
source = "ThemePage.qml"
title = "Theme"
description = "Colors, effects, and palettes"
context = "ControlCenterWindow"
icon = "palette"
group = "personalization"
order = 20
aliases = ["advanced", "matugen", "effects", "general.effects", "transparency", "blur"]

[[settings]]
id = "network"
source = "NetworkPage.qml"
title = "Network"
description = "Wi-Fi and wired connections"
context = "ControlCenterWindow"
icon = "wifi"
group = "connectivity"
order = 80
aliases = ["general.network"]

[[settings]]
id = "connected-devices"
source = "ConnectedDevicesPage.qml"
title = "Connected devices"
description = "Bluetooth devices and pairing"
context = "ControlCenterWindow"
icon = "devices_other"
group = "connectivity"
order = 90
aliases = ["general.connected-devices", "bluetooth"]

[[settings]]
id = "connected-devices.bluetooth-pairing"
source = "BluetoothPairingPage.qml"
title = "Pair new device"
description = "Scan and pair nearby devices"
context = "ConnectedDevicesPage"
icon = "bluetooth_searching"
group = "connectivity"
order = 91
aliases = ["general.bluetooth-pairing"]

[[settings]]
id = "language-region"
source = "LanguageAndRegionPage.qml"
title = "Language & region"
description = "Language, temperature, and clock"
context = "ControlCenterWindow"
icon = "language"
group = "system"
order = 120
aliases = ["general.language-region"]

[[settings]]
id = "shell"
source = "ShellPage.qml"
title = "Nyxuri Shell"
description = "Unit toggles and diagnostics"
context = "ControlCenterWindow"
icon = "monitor_heart"
group = "system"
order = 130
aliases = ["control-plane", "diagnostics"]

[[settings]]
id = "about"
source = "AboutPage.qml"
title = "About"
description = "System information and versions"
context = "ControlCenterWindow"
icon = "info"
group = "about"
order = 140

