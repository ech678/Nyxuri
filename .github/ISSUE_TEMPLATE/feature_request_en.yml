name: Feature Request (English)
description: Suggest a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
assignees: ["ech678"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, consider whether the suggestion fits Nyxuri's principles of minimalism and order.
  - type: textarea
    id: problem
    attributes:
      label: Context
      description: What specific pain point or flaw does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the expected behavior or visual design.
    validations:
      required: true
