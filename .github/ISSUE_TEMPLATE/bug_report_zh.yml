name: 错误报告 (中文)
description: 报告 Nyxuri 脚本或配置异常
title: "[Bug] "
labels: ["bug"]
assignees: ["ech678"]
body:
  - type: markdown
    attributes:
      value: |
        提交前，建议运行 `./install.sh` 并选择生成诊断报告。
        如需协助：[Telegram](https://t.me/Echoes678) | QQ群 (631425889)
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 直陈事实。描述发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 触发该问题的具体步骤。
      placeholder: |
        1. 执行 ...
        2. 预期 ...
        3. 实际 ...
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: 诊断日志
      description: 粘贴 nyxuri-bug-report-*.md 的内容。若无日志，请提供系统与硬件环境。
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 截图、录屏或其他相关背景。
