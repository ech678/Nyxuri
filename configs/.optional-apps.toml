# Optional installable apps — no NyxNiri config shipped, just package metadata
# for the apps menu + AUR optdepends. Single source of truth (§3.1 spirit:
# data-driven, no hardcoded dict). Independent of config dirs (§2 the two-axis
# design): an app here stays "optional" even if a configs/<app>/ dir is later
# added — then it's optional AND has config, both true at once.
#
# Field defaults mirror .module.toml: repo defaults to [name], aur/label/detect
# default to [] / name / name. Add an [[app]] block per optional app.
# Extra menu fields:
#   category = "<key>"  grouping key; display name resolved from i18n
#                       "apps_cat_<key>" (zh/en pair required)
#   flatpak  = ["id"]   Flathub application IDs — installed and detected via
#                       flatpak, never pacman/AUR. Flatpak-only apps must
#                       declare repo = [] explicitly.
# Block order = menu order within categories; categories follow first appearance.

[[app]]
name = "brave-origin"
label = "Brave Origin"
category = "browser"
repo = []
aur = ["brave-origin-bin"]
detect = "brave-origin"

[[app]]
name = "libreoffice"
label = "LibreOffice"
category = "office"
repo = ["libreoffice-fresh"]
detect = "libreoffice"

