# mango (wlroots) 专用门户路由。
# 桌面专属文件名优先级高于同目录的 portals.conf，因此只在 mango 会话生效。
# ScreenCast/Screenshot 交给 xdg-desktop-portal-wlr（mango 提供 zwlr-screencopy），
# 否则会落到 gnome 后端，而 gnome 后端需要 mutter，mango 下必然失败。
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Settings=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.FileChooser=gnome;gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.ScreenCast=wlr;
org.freedesktop.impl.portal.Screenshot=wlr;
