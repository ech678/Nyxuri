# ==============================================================================
# 用户自定义配置 (User Custom Configuration for Mango)
# ==============================================================================
# 此文件受 Nyxuri Dunder (__custom__) 协议保护，在系统更新与预设切换时会自动保留。
# 你可以在此添加个人专属的快捷键绑定、窗口规则或启动项。
# 示例：
#
# 自定义快捷键绑定：
# bind=SUPER,B,spawn,brave
#
# 自定义窗口浮动规则：
# windowrule=isfloating:1,appid:my-custom-app
#
# 覆写显示或间隙参数：
# gappih=10
# gappoh=10
# ==============================================================================
