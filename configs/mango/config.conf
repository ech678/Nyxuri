# ==============================================================================
# Mango Wayland Compositor 主配置文件 (config.conf)
# Adapted for Nyxuri Desktop Environment
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 视觉效果与窗口装饰 (Appearance & Window Decorations)
# ------------------------------------------------------------------------------
blur=0
blur_layer=0
blur_optimized=0

shadows=0
layer_shadows=0
shadow_only_floating=0

border_radius=12
borderpx=0

focused_opacity=0.9
unfocused_opacity=0.85

animations=1
layer_animations=1

# ------------------------------------------------------------------------------
# 2. 布局与滚动条配置 (Layout & Scroller Configuration)
# ------------------------------------------------------------------------------
scroller_structs=20
scroller_default_proportion=0.9
scroller_focus_center=1
scroller_prefer_center=0
scroller_prefer_overspread=0
edge_scroller_pointer_focus=0
scroller_default_proportion_single=0.9
scroller_ignore_proportion_single=0
scroller_proportion_preset=0.667,0.8,1.0

new_is_master=1
smartgaps=0
default_mfact=0.55
default_nmaster=1
circle_layout=scroller,tile,monocle,grid

# 边距间隙 (Gaps)
gappih=12
gappiv=12
gappoh=12
gappov=12

# 特殊工作区间隙与暗化 (Special Workspace Gaps & Dim)
special_gappih=12
special_gappiv=12
special_gappoh=12
special_gappov=12
special_dim=0.5

# ------------------------------------------------------------------------------
# 3. 输入设备与指针行为 (Input Devices & Pointer Behavior)
# ------------------------------------------------------------------------------
repeat_rate=25
repeat_delay=600
numlockon=1

mouse_accel_profile=2
mouse_accel_speed=-0.72

cursor_theme=Adwaita
cursor_size=24
cursor_hide_on_keypress=1

enable_floating_snap=1
snap_distance=30
drag_tile_to_tile=1

# ------------------------------------------------------------------------------
# 4. 显示器与工作区配置 (Monitors & Workspaces)
# ------------------------------------------------------------------------------
# 优先加载由 Noctalia Display 插件生成的显示器配置 (跨部署保留)
source-optional=~/.config/mango/monitors.conf

# 默认内置显示器兜底规则
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1

tagrule=id:1,no_hide:1,layout_name:scroller
tagrule=id:2,no_hide:1,layout_name:scroller
tagrule=id:3,no_hide:1,layout_name:scroller
tagrule=id:4,no_hide:1,layout_name:scroller
tagrule=id:5,no_hide:1,layout_name:scroller
tagrule=id:6,no_hide:1,layout_name:scroller
tagrule=id:7,no_hide:1,layout_name:scroller
tagrule=id:8,no_hide:1,layout_name:scroller
tagrule=id:9,no_hide:1,layout_name:scroller

# ------------------------------------------------------------------------------
# 5. 快捷键绑定 (Keybindings)
# ------------------------------------------------------------------------------
# 系统与窗口管理
bind=SUPER,Tab,toggleoverview
bind=SUPER,Q,killclient
bind=SUPER,Return,spawn,kitty
bind=SUPER,E,spawn,nautilus

# 外壳网关与桌面操作 (适配 Nyxuri 统一 shell-action 网关)
bind=SUPER,R,spawn,/home/user/.config/mango/scripts/shell-action.sh launcher
bind=SUPER,X,spawn,/home/user/.config/mango/scripts/shell-action.sh session
bind=SUPER,I,spawn,/home/user/.config/mango/scripts/shell-action.sh settings
bind=SUPER,V,spawn,/home/user/.config/mango/scripts/shell-action.sh clipboard
bind=SUPER,W,spawn,/home/user/.config/mango/scripts/shell-action.sh wallpaper-picker
bind=SUPER+CTRL,W,spawn,/home/user/.config/mango/scripts/shell-action.sh wallpaper-random
bind=SUPER+SHIFT,W,spawn,noctalia msg panel-toggle noctalia/mpvpaper:picker
bind=SUPER,N,spawn,noctalia msg nightlight-toggle
bind=SUPER,L,spawn,/home/user/.config/mango/scripts/shell-action.sh lock
bind=SUPER+CTRL,A,spawn,/home/user/.config/mango/scripts/shell-action.sh radial-launcher
bind=ALT,E,spawn,/home/user/.config/mango/scripts/shell-action.sh translate

# 方向与焦点导航
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# 客户端交换
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Right,exchange_client,right

# 布局切换与窗口状态
bind=SUPER,T,togglefloating
bind=SUPER,F,togglefullscreen
bind=SUPER,A,togglemaximizescreen
bind=SUPER,Space,switch_layout
bind=SUPER,M,switch_proportion_preset

bind=SUPER,P,togglefakefullscreen
bind=SUPER,C,centerwin
bind=SUPER,Y,zoom
bind=SUPER+SHIFT,F,toggle_all_floating

# 便签与最小化 (Scratchpad & Minimize)
bind=SUPER,Z,toggle_scratchpad
bind=SUPER+SHIFT,Z,minimized
bind=SUPER+ALT,Z,restore_minimized

# 特殊工作区 (Special Tag 0)
bind=SUPER,G,toggle_special_tag
bind=SUPER+SHIFT,G,tag_special_tag
bind=SUPER+CTRL,G,tag_special_silent

# 窗口切换器
bind=ALT,Tab,switcher,next
bind=ALT+SHIFT,Tab,switcher,prev

# 鼠标移动与缩放
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# 触控板手势 (Touchpad Gestures)
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# 工作区切换 (Super + 1-9) 与分配 (Alt + 1-9)
bind=SUPER,1,toggleview,1
bind=SUPER,2,toggleview,2
bind=SUPER,3,toggleview,3
bind=SUPER,4,toggleview,4
bind=SUPER,5,toggleview,5
bind=SUPER,6,toggleview,6
bind=SUPER,7,toggleview,7
bind=SUPER,8,toggleview,8
bind=SUPER,9,toggleview,9

bind=ALT,1,tag,1
bind=ALT,2,tag,2
bind=ALT,3,tag,3
bind=ALT,4,tag,4
bind=ALT,5,tag,5
bind=ALT,6,tag,6
bind=ALT,7,tag,7
bind=ALT,8,tag,8
bind=ALT,9,tag,9

# 截图与帮助 (Screenshots & Helpers)
bind=SUPER+SHIFT,S,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=SUPER,Slash,spawn,rofi -show help

keymode=common
bind=SUPER+SHIFT,E,quit
bind=SUPER+SHIFT,R,reload_config

# 多媒体按键 (WirePlumber / Noctalia IPC)
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=NONE,XF86AudioPlay,spawn,noctalia msg media play-pause
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous

# 屏幕亮度 (走统一 mango-brightness 脚本，兼顾内屏背光与外接屏 DDC/CI)
bind=NONE,XF86MonBrightnessUp,spawn,/home/user/.config/mango/scripts/mango-brightness.sh up
bind=NONE,XF86MonBrightnessDown,spawn,/home/user/.config/mango/scripts/mango-brightness.sh down

# 截屏按键
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=CTRL,Print,spawn_shell,grim -o "$(mmsg get cursorpos | jq -r '.monitor')" - | wl-copy
bind=ALT,Print,spawn_shell,grim -g "$(mmsg get focusing-client | jq -r '"\(.x),\(.y) \(.width)x\(.height)"')" - | wl-copy
bind=SUPER,F1,spawn,mark-shot
keymode=default

# 多显示器焦点与分配
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=ALT+SHIFT,Down,focusmon,down
bind=ALT+SHIFT,Up,focusmon,up

bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right
bind=SUPER+ALT,Down,tagmon,down
bind=SUPER+ALT,Up,tagmon,up

# ------------------------------------------------------------------------------
# 6. 窗口与图层规则 (Window & Layer Rules)
# ------------------------------------------------------------------------------
windowrule=isfloating:1,appid:dev.noctalia.Noctalia
windowrule=isfloating:0,appid:gnome-control-center
windowrule=isfloating:0,appid:pavucontrol
windowrule=isfloating:0,appid:nm-connection-editor
windowrule=isfloating:1,appid:org.gnome.Calculator
windowrule=isfloating:1,appid:gnome-calculator
windowrule=isfloating:1,appid:galculator
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:org.gnome.Nautilus
windowrule=isfloating:1,appid:xdg-desktop-portal
windowrule=isfloating:1,appid:firefox,title:Picture-in-Picture
windowrule=isfloating:1,appid:zoom
windowrule=isfloating:1,appid:io.ente.auth
windowrule=isfloating:1,appid:wpsoffice,title:字体

layerrule=noblur:1,noshadow:1,layer_name:noctalia-bar-bar
layerrule=noanim:1,noblur:1,layer_name:selection

# ------------------------------------------------------------------------------
# 7. 环境变量 (Environment Variables)
# ------------------------------------------------------------------------------
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=QT_IM_MODULES,wayland;fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus
env=GTK_CSD,0
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,kvantum
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=MOZ_ENABLE_WAYLAND,1
env=MOZ_WAYLAND_USE_VAAPI,1
env=GBM_BACKEND,nvidia-drm
env=__GLX_VENDOR_LIBRARY_NAME,nvidia

# ------------------------------------------------------------------------------
# 8. 自启动与桌面外壳 (Startup & Desktop Shell)
# ------------------------------------------------------------------------------
exec-once=dex -a
exec-once=fcitx5
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once=wl-paste --type text --watch cliphist store
exec=/home/user/.config/mango/scripts/session-shell.sh

# ------------------------------------------------------------------------------
# 9. 动态主题与组件挂载 (Dynamic Theme & Custom Extensibility)
# ------------------------------------------------------------------------------
# 加载 Noctalia 动态渲染的主题配色 (受 Manifest preserve 保护)
source-optional=~/.config/mango/noctalia.conf

# 加载用户自定义配置 (受 Nyxuri Dunder __custom__ 协议保护，更新自动继承)
source-optional=~/.config/mango/__custom__.conf

# ------------------------------------------------------------------------------
# 10. 交互模式与调整模式 (Keymodes & Resize)
# ------------------------------------------------------------------------------
keymode=default
bind=SUPER+CTRL,R,setkeymode,resize

keymode=resize
bind=NONE,Left,resizewin,-40,0
bind=NONE,Right,resizewin,+40,0
bind=NONE,Up,resizewin,0,-40
bind=NONE,Down,resizewin,0,+40
bind=NONE,H,smartresizewin,left
bind=NONE,J,smartresizewin,down
bind=NONE,K,smartresizewin,up
bind=NONE,L,smartresizewin,right
bind=NONE,M,setmfact,+0.05
bind=SHIFT,M,setmfact,-0.05
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default

keymode=default

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

bind=SUPER+SHIFT,Tab,togglejump
