# 包目录清单 — 声明「装但不部署」的软件。这不是单元（unit-model §2）：
# 目录条目不携带配置文件、没有账本生命周期，只服务一处消费：
# `nyxuri deps apps` 菜单。packaging/gen-deps.py 有意不读这份清单
# （T1 依赖按需化后 optdepends 与菜单脱钩，见 PKGBUILD 头注释）。
# 显示名（双语）住 nyxuri/translations.toml 的 app_* 键，此处不重复。

[brave-origin]
label = "Brave Origin"
category = "browser"
packages_aur = ["brave-origin-bin"]

[brave-origin.platforms.ubuntu]
packages = ["brave-origin"]
reason = "Requires the official Brave APT source to be configured already."

[flclash]
label = "FlClash"
category = "proxy"
detect = "flclash"
packages_aur = ["flclash-bin"]

[flclash.platforms.ubuntu]
manual = ["flclash"]
reason = "Official releases include a prebuilt Linux .deb package; install it manually."

[quickshell]
# Nyxuri Shell 的独立运行时底座；Noctalia v5 不再提供 Quickshell。
label = "Quickshell"
category = "shell-runtime"
detect = "quickshell"
packages = ["matugen", "jq"]
packages_aur = ["quickshell"]

[quickshell.platforms.ubuntu]
# Ubuntu 的 Quickshell DEB 只拉取 Qt 共享库，QML 模块需要单独声明。
# Controls 传递提供 QtQuick、QtQml、Shapes、Templates、Window；其余按 Shell 的 import 补齐。
packages = [
    "quickshell",
    # Shell 从壁纸提取色板并组装模板数据，启动 QML 本身不代表这条链路可用。
    "matugen",
    "jq",
    "qml6-module-qtquick-controls",
    "qml6-module-qtquick-effects",
    "qml6-module-qtquick-layouts",
    "qml6-module-qtcore",
    "qml6-module-qt-labs-folderlistmodel",
    "qml6-module-qt5compat-graphicaleffects",
]
# Shell 的图标使用 Material Symbols 字族；旧 Material Icons 不能提供同一套字形。
manual = ["material-symbols-rounded-font", "material-symbols-outlined-font"]
reason = "Quickshell requires a separately configured APT source; provide Google's prebuilt Material Symbols Rounded and Outlined fonts manually."

