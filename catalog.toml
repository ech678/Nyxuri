[mpvpaper]
# 视频壁纸的可选播放器；Ubuntu 静态壁纸安装不依赖它，Arch 工具链声明保持原样。
label = "mpvpaper"
category = "video"
detect = "mpvpaper"
packages_aur = ["mpvpaper"]

[mpvpaper.platforms.ubuntu]
manual = ["mpvpaper"]
reason = "Optional video wallpaper player; static wallpapers do not require it. No automatic Ubuntu supply is configured: provide the mpvpaper executable manually. Nyxuri does not download or build it."

