window_padding_width 5
hide_window_decorations yes
background_opacity 0.9
font_family JetBrains Mono
font_size 12.0
remember_window_size no
confirm_os_window_close 0
shell fish
cursor_trail 1 
cursor_shape block
shell_integration no-cursor

include themes/noctalia.conf

# Copy/paste orthodoxy (ROADMAP T0 verdict, settled — do not revisit):
# kitty defaults only. Ctrl+Shift+C / Ctrl+Shift+V are the sole copy/paste
# path; Ctrl+C/V belong to terminal programs (fish/vim/fzf/htop). No key
# hijacks, no right-click paste, no select-all pipe. copy_on_select no keeps
# clipboard copy explicit — selection still feeds the primary (middle-click).
copy_on_select no

# Fast word deletion (Windows-style)
map ctrl+backspace send_text all \x17
map ctrl+delete send_text all \x1bd

# Font size adjustments (Windows/Browser style)
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# User Custom Configurations / 用户私有配置挂载点
include __custom__.conf

