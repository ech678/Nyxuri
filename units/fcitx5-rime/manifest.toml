# Fcitx5 Rime — 输入法 + NyxMellow 皮肤一体单元
target = "fcitx5"
merge = true
legacy_targets = { "fcitx5-rime" = "directory" }
optional = true
packages = ["fcitx5", "fcitx5-gtk", "fcitx5-qt", "fcitx5-configtool", "fcitx5-rime"]
packages_aur = ["rime-ice-git"]
label = "Fcitx5 Rime"
category = "system"
preserve = ["conf/classicui.conf", "profile"]
post_install = "activate"
post_remove = "deactivate"

[platforms.ubuntu]
packages = ["fcitx5", "fcitx5-frontend-gtk3", "fcitx5-frontend-gtk4", "fcitx5-frontend-qt5", "fcitx5-frontend-qt6", "fcitx5-config-qt", "fcitx5-rime"]
manual = ["rime-ice"]
reason = "Install the upstream prebuilt full schema archive into the Fcitx5 Rime user directory, then deploy it; no software source build is required."
