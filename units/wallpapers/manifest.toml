# 壁纸单元 — 离线 fallback 蓝图 + 共享生活区
#
# 生活区由 get_pics_dir() 解析图片目录，再接 Wallpapers；支持本地化目录名。
# merge 更新未变受管文件并保留个人修改，off 先归档修改再撤回登记文件；
# 外部壁纸包属于用户内容，由 hooks/install-pack 手动安装，不入账本。
optional = true
packages = []
target = "@pictures/Wallpapers"
legacy_targets = { "~/Pictures/Wallpapers" = "merge" }
merge = true
label = "Wallpapers"
category = "system"
chmod = ["hooks/install-pack"]
