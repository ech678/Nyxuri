# Mango Wayland Compositor manifest
optional = true
packages = ["mangowm"]
label = "Mango WM"
category = "system"
preserve = ["monitors.conf", "noctalia.conf"]
chmod = ["scripts/*.sh", "scripts/*.py"]

[presets]
reload = ["mmsg", "dispatch", "reload_config"]

[platforms.ubuntu]
supported = false
reason = "Upstream does not provide an Ubuntu prebuilt package; its Ubuntu route requires building Mango from source."
