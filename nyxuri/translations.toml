[cli_help]
zh = """{0} 桌面插件市场 ({1})
用法: {1} [命令] [参数]

单元动词（单元 = 一切可独立开关的桌面能力）:
  list [单元]                        全景清单，或单个单元的详情
  on <单元> [--preset <名称>] [--force]        启用单元（含依赖闭包与包披露，等价 enable）
  off <单元> [--cascade]             停用单元（保存修改并移除本单元配置，等价 disable）
  doctor [单元]                      对账（Synced/Drifted/Ghost/Pending/Orphan）+ 系统体检

系统与领域:
  install [full|config]              安装单元（config = 只复制配置，之后需用 on 完成启用）
  update [--local] [--force|--deploy|--no-deploy] [--to <tag|commit>]  更新源码，并按需应用配置
  preset <app> [list|apply <名>|save <名>|edit <名>|delete <名>]  切换或管理预设
  preset <app> [parts|part <插槽> <名称>]  查看或切换零件插槽变体
  apply / part 可加 --force，先备份再覆盖冲突
  shell [get|set|switch|status]      查看或切换桌面外壳插槽（实验性）
  theme [toggle|dark|light|sync|status]  原生切换或同步深浅主题
  deps [core|apps]                   核心依赖勾选单，或常用软件目录（catalog 同源）
  pkg <install|upgrade|remove|search|info|installed>  包管理直通
  clean [-n] [--only <任务>]         缓存清理（-n 仅预览）
  snapshot [备注|list|delete [序号]] 创建、列出或删除配置快照
  rollback [序号]                    恢复历史配置快照
  uninstall [--all|standard|restore|purge]  勾选式卸载（或直达指定范围）
  bug                                导出诊断报告
  test                               开发者沙箱部署测试
  help                               显示本帮助
  无参数                             打开控制面板
"""
en = """{0} desktop plugin market ({1})
Usage: {1} [command] [args]

Unit verbs (a unit = any independently switchable desktop capability):
  list [unit]                        Full inventory, or one unit in detail
  on <unit> [--preset <name>] [--force]        Enable a unit (dependency closure + package disclosure, same as enable)
  off <unit> [--cascade]             Disable a unit (save changes and remove its configuration, same as disable)
  doctor [unit]                      Audit (Synced/Drifted/Ghost/Pending/Orphan) + system checkup

System & Domains:
  install [full|config]              Install units (config = copy configuration only, then use on to finish enabling)
  update [--local] [--force|--deploy|--no-deploy] [--to <tag|commit>]  Update source, optionally apply configs
  preset <app> [list|apply <n>|save <n>|edit <n>|delete <n>]  Switch or manage presets
  preset <app> [parts|part <slot> <name>]  Inspect or hot-swap component parts
  apply / part accept --force to back up and replace conflicts
  shell [get|set|switch|status]      Inspect or switch desktop shell slot (experimental)
  theme [toggle|dark|light|sync|status]  Switch or sync light/dark theme
  deps [core|apps]                   Core dependencies, or recommended apps (catalog-backed)
  pkg <install|upgrade|remove|search|info|installed>  Direct package management
  clean [-n] [--only <tasks>]        Cache cleanup (-n for preview)
  snapshot [note|list|delete [idx]]  Create, list, or delete config snapshots
  rollback [index]                   Restore a config snapshot
  uninstall [--all|standard|restore|purge]  Checkbox uninstall (or direct mode)
  bug                                Export a diagnostic report
  test                               Run the developer sandbox deploy
  help                               Show this help
  no arguments                       Open the control panel
"""

