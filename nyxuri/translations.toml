[cli_help]
zh = """{0} 桌面插件引擎 ({1})
用法: {1} [命令] [参数]

插件动词（插件 = 一切可独立开关的桌面能力）:
  list [插件]                        全景清单，或单个插件的详情
  on <插件> [--form <形态>]          启用插件（含依赖闭包与包披露，等价 enable）
  off <插件> [--cascade]             停用插件（自定义文件收存，实机抹白，等价 disable）
  use <插件> [list|<形态>|save|edit|delete|slots|slot <轴> <变体>]  切换或管理形态
  doctor [插件]                      三态对账（Synced/Drifted/Ghost）+ 系统体检

系统与领域:
  install [full|config]              应用配置（full = 含壁纸与钩子重放）
  update [--force|--no-deploy] [--to <tag|commit>]  更新源码，并按需应用配置
  use <插件> [list|<形态>|save|edit|delete|slots|slot <轴> <变体>]  切换或管理形态
  shell [get|set|switch|status]      查看或切换桌面外壳插槽（实验性）
  theme [toggle|dark|light|sync|status]  原生切换或同步深浅主题
  deps [core|apps]                   核心依赖勾选单，或常用软件勾选单（插件声明聚合）
  pkg <install|upgrade|remove|search|info|installed>  包管理直通
  clean [-n] [--only <任务>]         缓存清理（-n 仅预览）
  snapshot [备注|list|delete [序号]] 创建、列出或删除配置快照
  rollback [序号]                    恢复历史配置快照
  uninstall [--all|standard|restore|purge]  勾选式卸载（或直达指定范围）
  bug                                导出诊断报告
  test                               开发者沙箱部署测试
  help                               显示本帮助
  无参数                             打开控制面板
"""
en = """{0} desktop plugin engine ({1})
Usage: {1} [command] [args]

Plugin verbs (a plugin = any independently switchable desktop capability):
  list [plugin]                        Full inventory, or one plugin in detail
  on <plugin> [--form <name>]          Enable a plugin (dependency closure + package disclosure, same as enable)
  off <plugin> [--cascade]             Disable a plugin (customs archived, living area wiped, same as disable)
  doctor [plugin]                      Three-state audit (Synced/Drifted/Ghost) + system checkup

System & Domains:
  install [full|config]              Apply configs (full = wallpapers + hook replay)
  update [--force|--no-deploy] [--to <tag|commit>]  Update source, optionally apply configs
  use <plugin> [list|<form>|save <n>|edit <n>|delete <n>|slots|slot <axis> <n>]  Switch or manage forms
  shell [get|set|switch|status]      Inspect or switch desktop shell slot (experimental)
  theme [toggle|dark|light|sync|status]  Switch or sync light/dark theme
  deps [core|apps]                   Core dependencies, or recommended apps (catalog-backed)
  pkg <install|upgrade|remove|search|info|installed>  Direct package management
  clean [-n] [--only <tasks>]        Cache cleanup (-n for preview)
  snapshot [note|list|delete [idx]]  Create, list, or delete config snapshots
  rollback [index]                   Restore a config snapshot
  uninstall [--all|standard|restore|purge]  Checkbox uninstall (or direct mode)
  bug                                Export a diagnostic report
  test                               Run the developer sandbox deploy
  help                               Show this help
  no arguments                       Open the control panel
"""

